<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#cfe6e3">
<title>마젯이랑 수다</title>
<meta name="description" content="팬이 만든 비공식 AI 마젯과 목소리로 수다 떠는 페이지">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* 레이아웃: 넓은 화면은 왼쪽 무대(캐릭터+음성 조작) + 오른쪽 대화 기록, 폰은 무대가 전체 화면이고 대화 기록은 아래에서 올라오는 시트.
   색은 캐릭터의 청록 머리와 호박색 눈에서 */
:root {
  --bg: #eef4f3;
  --surface: #ffffff;
  --stage: #cfe6e3;
  --stage-2: #f4efe4;
  --ink: #1f2b2c;
  --muted: #5f7273;
  --line: #d3e0de;
  --teal: #1e8f8b;
  --amber: #b97418;
  --amber-soft: #fbe9cd;
  --me: #1e8f8b;
  --me-ink: #ffffff;
  --danger: #b4483c;
  --font-display: "Jua", "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #141c1d; --surface: #1d2829; --stage: #1c3334; --stage-2: #2a2620; --ink: #e6efee; --muted: #93a8a8; --line: #2c3b3c;
    --teal: #4fd2cd; --amber: #f0b45a; --amber-soft: #3b2f1c; --me: #2a9e99; --me-ink: #ffffff; --danger: #ef8a7d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #141c1d; --surface: #1d2829; --stage: #1c3334; --stage-2: #2a2620; --ink: #e6efee; --muted: #93a8a8; --line: #2c3b3c;
  --teal: #4fd2cd; --amber: #f0b45a; --amber-soft: #3b2f1c; --me: #2a9e99; --me-ink: #ffffff; --danger: #ef8a7d; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--ink); font: 16px/1.55 var(--font-body);
  padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@supports (height: 100dvh) { html, body { height: 100dvh; } }
button { font: inherit; }
.app { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr); max-width: 1180px; margin: 0 auto; }
@media (min-width: 860px) { .app { grid-template-columns: minmax(0, 1.15fr) minmax(360px, 1fr); padding: 16px; gap: 16px; } }

/* 무대 */
.stage {
  position: relative; min-height: 0; overflow: hidden; display: flex; flex-direction: column;
  background: radial-gradient(110% 80% at 50% 70%, var(--stage-2) 0%, var(--stage) 70%);
}
@media (min-width: 860px) { .stage { border-radius: 24px; } }
.view { position: relative; flex: 1; min-height: 0; }
.avatar {
  position: absolute; left: 50%; bottom: 0; height: 100%; aspect-ratio: 410 / 518; max-width: 100%;
  transform: translateX(-50%);
  -webkit-mask-image: linear-gradient(to bottom, #000 90%, transparent); mask-image: linear-gradient(to bottom, #000 90%, transparent);  /* 상반신 그림의 잘린 아랫단이 티 나지 않게 */
}
.avatar .rig { position: absolute; inset: 0; transform-origin: 50% 100%; animation: breathe 3.8s ease-in-out infinite; transition: rotate 0.4s ease; }
.avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; visibility: hidden; user-select: none; -webkit-user-drag: none; }
.avatar img.on { visibility: visible; }
.avatar[data-talk="1"] .rig { animation: breathe 3.8s ease-in-out infinite, bob 0.32s ease-in-out infinite; }
.avatar[data-tilt="left"] .rig { rotate: -3deg; }
.avatar[data-tilt="right"] .rig { rotate: 3deg; }
@keyframes breathe { 50% { transform: translateY(0.6%) scale(1.004); } }
@keyframes bob { 50% { translate: 0 -0.5%; } }
.plate {
  position: absolute; left: 16px; top: 14px; display: flex; align-items: center; gap: 10px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 8px 12px;
}
.plate h1 { margin: 0; font: 22px/1 var(--font-display); }
.status { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
.status[data-state="on"] .dot { background: var(--teal); }
.status[data-state="off"] .dot { background: var(--danger); }
.mood { position: absolute; right: 16px; top: 14px; font: 15px/1 var(--font-display); padding: 8px 12px; border-radius: 999px; background: var(--amber-soft); color: var(--amber); }

/* 자막: 위는 내가 한 말(인식 중에는 실시간), 아래는 마젯 답변 */
.caption { padding: 0 16px 6px; min-height: 96px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; }
.cap-me { margin: 0; min-height: 1.4em; max-width: 560px; font-size: 14px; color: var(--muted); text-align: center; overflow-wrap: anywhere; word-break: keep-all; }
.cap-me.live { color: var(--teal); }
.cap-majet {
  margin: 0; max-width: 560px; max-height: 7.2em; overflow-y: auto; padding: 10px 16px; border-radius: 18px; text-align: center;
  font-size: 17px; line-height: 1.5; word-break: keep-all; overflow-wrap: anywhere;
  background: var(--surface); border: 1px solid var(--line);
}
@supports (background: color-mix(in srgb, red 50%, blue)) { .cap-majet { background: color-mix(in srgb, var(--surface) 86%, transparent); } }
.cap-majet:empty { display: none; }

/* 조작: 대화 기록 | 마이크 | 설정 */
.dock { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 10px 16px 0; }
.dock-row { display: flex; align-items: center; justify-content: center; gap: 30px; }
.round {
  width: 48px; height: 48px; padding: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  background: var(--surface); color: var(--ink); border: 1px solid var(--line);
}
.round svg, .orb svg { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.round svg { width: 22px; height: 22px; }
@media (min-width: 860px) { #openChat { visibility: hidden; } }
.orb {
  position: relative; width: 88px; height: 88px; padding: 0; border: 0; border-radius: 50%; display: grid; place-items: center; cursor: pointer;
  background: var(--teal); color: #fff; box-shadow: 0 6px 18px rgba(30, 143, 139, 0.35); transition: background 0.2s, color 0.2s, transform 0.1s;
  -webkit-tap-highlight-color: transparent;
}
.orb:active { transform: scale(0.96); }
.orb svg { width: 36px; height: 36px; }
.orb::before { content: ""; position: absolute; inset: -9px; border-radius: 50%; border: 3px solid var(--teal); opacity: 0; pointer-events: none; }
.orb[data-state="off"]::before, .orb[data-state="listen"]::before { animation: ring 2.4s ease-in-out infinite; }
.orb[data-state="hear"]::before { opacity: calc(0.5 + var(--lv, 0) * 0.5); transform: scale(calc(1.06 + var(--lv, 0) * 0.28)); transition: transform 0.08s, opacity 0.08s; }
.orb[data-state="think"] { background: var(--amber-soft); color: var(--amber); box-shadow: none; }
.orb[data-state="think"]::before { opacity: 1; border-color: transparent; border-top-color: var(--amber); animation: spin 1s linear infinite; }
.orb[data-state="speak"] { background: var(--amber); color: #fff; box-shadow: 0 6px 18px rgba(185, 116, 24, 0.35); }
.orb[data-state="mute"] { background: var(--surface); color: var(--muted); border: 1px solid var(--line); box-shadow: none; }
@keyframes ring { 0%, 100% { opacity: 0.12; transform: scale(1); } 50% { opacity: 0.5; transform: scale(1.12); } }
@keyframes spin { to { transform: rotate(360deg); } }
.orb-label { margin: 0; min-height: 1.5em; font: 15px/1.5 var(--font-display); color: var(--ink); text-align: center; }
.credit { margin: 0; padding: 4px 20px calc(10px + env(safe-area-inset-bottom, 0px)); font-size: 11.5px; line-height: 1.45; color: var(--muted); text-align: center; }
@media (min-width: 860px) { .credit { padding-bottom: 12px; } }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 3px solid var(--amber); outline-offset: 2px; }

/* 대화 기록 */
.chat { min-height: 0; display: flex; flex-direction: column; background: var(--surface); }
@media (min-width: 860px) { .chat { border: 1px solid var(--line); border-radius: 24px; overflow: hidden; } .chat-head { display: none !important; } }
@media (max-width: 859px) {
  .chat {
    position: fixed; left: 0; right: 0; bottom: 0; height: 74%; z-index: 20; border-radius: 22px 22px 0 0;
    box-shadow: 0 -10px 36px rgba(0, 0, 0, 0.22); transform: translateY(105%); visibility: hidden;
    transition: transform 0.25s ease, visibility 0s 0.25s; padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  .chat.open { transform: none; visibility: visible; transition: transform 0.25s ease, visibility 0s; }
}
.chat-head { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 6px 18px; font: 18px/1 var(--font-display); }
.chat-head .round { width: 40px; height: 40px; }
.notice { margin: 0; padding: 8px 16px; font-size: 12.5px; color: var(--muted); border-bottom: 1px solid var(--line); }
#log { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.msg { max-width: 86%; padding: 10px 14px; border-radius: 18px; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; min-width: 0; }
.msg.majet { align-self: flex-start; background: var(--bg); border-bottom-left-radius: 6px; }
.msg.me { align-self: flex-end; background: var(--me); color: var(--me-ink); border-bottom-right-radius: 6px; }
.msg.sys { align-self: center; max-width: 100%; font-size: 13px; color: var(--muted); padding: 2px 0; text-align: center; }
.msg.majet .name { display: block; font: 14px/1 var(--font-display); color: var(--teal); margin-bottom: 4px; }
.typing::after { content: "…"; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0.2; } }
#f { display: flex; gap: 8px; padding: 12px 16px 10px; border-top: 1px solid var(--line); }
#q { flex: 1; min-width: 0; font: inherit; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
#send { flex: none; font: 17px/1 var(--font-display); border: 0; border-radius: 14px; padding: 0 16px; min-height: 48px; background: var(--teal); color: #fff; cursor: pointer; }
#send:disabled { opacity: 0.5; cursor: default; }

/* 설정 */
dialog { width: min(420px, calc(100% - 32px)); padding: 0; border: 1px solid var(--line); border-radius: 22px; background: var(--surface); color: var(--ink); }
dialog::backdrop { background: rgba(0, 0, 0, 0.4); }
dialog form { padding: 20px; display: grid; gap: 14px; }
dialog h2 { margin: 0; font: 22px/1 var(--font-display); }
.row { display: grid; grid-template-columns: auto 1fr; gap: 12px; align-items: start; cursor: pointer; }
.row.col { grid-template-columns: 1fr; cursor: default; }
.row input[type="checkbox"] { width: 22px; height: 22px; margin: 2px 0 0; accent-color: var(--teal); }
.row b { display: block; font-weight: 700; }
.row small { display: block; color: var(--muted); font-size: 13px; line-height: 1.45; }
.row select { font: inherit; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin-top: 6px; }
dialog .close { min-height: 48px; border: 0; border-radius: 14px; background: var(--teal); color: #fff; font: 17px/1 var(--font-display); cursor: pointer; }
@media (prefers-reduced-motion: reduce) {
  .avatar .rig, .avatar[data-talk="1"] .rig, .typing::after, .orb::before { animation: none !important; }
  .orb[data-state="off"]::before, .orb[data-state="listen"]::before { opacity: 0.35; }
  .chat { transition: none; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-mic" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></symbol>
  <symbol id="i-micoff" viewBox="0 0 24 24"><path d="M12 3a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V6a3 3 0 0 0-3-3z"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M4 4l16 16"/></symbol>
  <symbol id="i-stop" viewBox="0 0 24 24"><rect fill="currentColor" stroke="none" x="6.5" y="6.5" width="11" height="11" rx="2.5"/></symbol>
  <symbol id="i-chat" viewBox="0 0 24 24"><path d="M5 5h14a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-7l-4 3v-3H5a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2z"/></symbol>
  <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h8M18 7h2M4 17h2M12 17h8"/><circle cx="15" cy="7" r="2.5"/><circle cx="9" cy="17" r="2.5"/></symbol>
  <symbol id="i-close" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
</svg>

<div class="app">
  <section class="stage" aria-label="마젯과 음성 대화">
    <div class="view">
      <div class="avatar" id="avatar" data-talk="0" role="img" aria-label="청록 단발에 호박색 눈을 한 마젯"><div class="rig" id="rig"></div></div>
      <div class="plate">
        <div>
          <h1>마젯</h1>
          <div class="status" id="status" data-state="wait"><span class="dot"></span><span id="statusText">연결 확인 중</span></div>
        </div>
      </div>
      <span class="mood" id="mood">평온</span>
    </div>
    <div class="caption" aria-live="polite">
      <p class="cap-me" id="capMe"></p>
      <p class="cap-majet" id="capMajet">마이크 버튼을 누르면 마젯이랑 대화가 시작돼요.</p>
    </div>
    <div class="dock">
      <div class="dock-row">
        <button type="button" class="round" id="openChat" aria-label="대화 기록 열기"><svg><use href="#i-chat"/></svg></button>
        <button type="button" class="orb" id="orb" data-state="off" aria-label="눌러서 대화 시작"><svg><use id="orbIco" href="#i-mic"/></svg></button>
        <button type="button" class="round" id="openSettings" aria-label="설정"><svg><use href="#i-sliders"/></svg></button>
      </div>
      <p class="orb-label" id="orbLabel" aria-live="polite">눌러서 대화 시작</p>
    </div>
    <p class="credit">팬이 만든 비공식 AI 캐릭터예요. 버튜버 마젯 본인과 관계없고, 목소리와 답변은 AI가 만들어요. 캐릭터 그림은 미츄(MEECHU) 마젯 3D 모델의 표정 이미지예요.</p>
  </section>

  <section class="chat" id="chat" aria-label="대화 기록">
    <div class="chat-head"><span>대화 기록</span><button type="button" class="round" id="closeChat" aria-label="대화 기록 닫기"><svg><use href="#i-close"/></svg></button></div>
    <p class="notice">글로도 말할 수 있어요. 마젯 목소리는 대화 중에 AI가 실시간으로 만들어요.</p>
    <div id="log" aria-live="off"></div>
    <form id="f">
      <input id="q" autocomplete="off" maxlength="300" placeholder="마젯에게 글로 말 걸기" aria-label="마젯에게 글로 말 걸기">
      <button id="send">보내기</button>
    </form>
  </section>
</div>

<dialog id="settings" aria-labelledby="stTitle">
  <form method="dialog">
    <h2 id="stTitle">설정</h2>
    <label class="row"><input type="checkbox" id="optAuto"><span><b>핸즈프리</b><small>마젯이 말을 마치면 자동으로 다시 들어요. 끄면 말할 때마다 버튼을 눌러요.</small></span></label>
    <label class="row"><input type="checkbox" id="optBarge"><span><b>이어폰 모드 · 말로 끼어들기</b><small>마젯이 말하는 중에 말을 걸면 바로 멈추고 들어요. 스피커로 들을 때는 꺼 두세요. 마젯 목소리가 마이크로 들어가서 혼자 멈춰요.</small></span></label>
    <label class="row col"><span><b>음성 인식</b><small>자동은 컴퓨터에서는 브라우저 인식(빠르고 실시간 자막), 폰에서는 마젯 서버 인식을 써요. 브라우저 인식은 크롬의 음성 인식(구글)을 거쳐요.</small></span>
      <select id="optStt"><option value="auto">자동</option><option value="browser">브라우저 (크롬·엣지)</option><option value="server">마젯 서버</option></select></label>
    <button class="close" value="close">닫기</button>
  </form>
</dialog>

<script>
const API = "/api";  // Vercel이 집 PC 공개 창구(Tailscale Funnel)로 넘겨준다(vercel.json)
const MOODS = { neutral: "평온", happy: "신남", sad: "시무룩", angry: "발끈", surprised: "깜짝", think: "고민 중", awkward: "머쓱", question: "갸웃", curious: "궁금" };
const $ = (id) => document.getElementById(id);
const log = $("log"), q = $("q"), send = $("send"), avatar = $("avatar"), rig = $("rig");
const orb = $("orb"), orbLabel = $("orbLabel"), capMe = $("capMe"), capMajet = $("capMajet");
const hist = [];

let session = "";
try { session = localStorage.getItem("majet-session") || ""; } catch (e) {}
if (!session) { session = Math.random().toString(36).slice(2) + Date.now().toString(36); try { localStorage.setItem("majet-session", session); } catch (e) {} }

/* ---------- 설정 (이 브라우저에만 저장) ---------- */
const prefs = { auto: true, bargeIn: false, stt: "auto" };
try { Object.assign(prefs, JSON.parse(localStorage.getItem("majet-prefs") || "{}")); } catch (e) {}
function savePrefs() { try { localStorage.setItem("majet-prefs", JSON.stringify(prefs)); } catch (e) {} }

/* ---------- 캐릭터: 표정 시트로 만든 프레임(avatar/*.webp)을 겹쳐 두고 하나만 보인다 ---------- */
// 서버 감정 → 표정 세트. talk는 말할 때(입 벌림), blink는 눈 깜빡임
const FACES = {
  neutral:   { base: "neutral",   talk: "neutral_talk",   blink: "neutral_blink" },
  happy:     { base: "happy",     talk: "happy_talk" },
  sad:       { base: "sad",       talk: "sad_talk" },
  angry:     { base: "angry",     talk: "angry_talk" },
  surprised: { base: "surprised", talk: "surprised_talk" },
  think:     { base: "relaxed",   talk: "relaxed_talk",   blink: "relaxed_blink", tilt: "right" },
  awkward:   { base: "relaxed",   talk: "relaxed_talk",   blink: "relaxed_blink" },
  curious:   { base: "neutral",   talk: "neutral_talk",   blink: "neutral_blink", tilt: "left" },
  question:  { base: "neutral",   talk: "neutral_talk",   blink: "neutral_blink", tilt: "left" },
};
const NAMES = ["neutral", "neutral_talk", "neutral_blink", "happy", "happy_talk", "angry", "angry_talk", "surprised", "surprised_talk",
  "sad", "sad_talk", "relaxed", "relaxed_talk", "relaxed_blink"];
const imgs = {};
for (const n of NAMES) {
  const im = new Image(); im.src = `avatar/${n}.webp`; im.alt = ""; im.decoding = "async";
  rig.appendChild(im); imgs[n] = im;
}
let emotion = "neutral", talking = false, blinking = false, shown = null;
function render() {
  const f = FACES[emotion] || FACES.neutral;
  const name = talking ? f.talk : (blinking && f.blink ? f.blink : f.base);
  if (name !== shown) { if (shown) imgs[shown].classList.remove("on"); imgs[name].classList.add("on"); shown = name; }
  avatar.dataset.talk = talking ? "1" : "0";
  avatar.dataset.tilt = f.tilt || "";
}
function setEmotion(e) { emotion = FACES[e] ? e : "neutral"; $("mood").textContent = MOODS[emotion] || "평온"; render(); }
function scheduleBlink() {
  setTimeout(() => { blinking = true; render(); setTimeout(() => { blinking = false; render(); scheduleBlink(); }, 140); }, 2500 + Math.random() * 3500);
}
scheduleBlink();

/* ---------- WAV 만들기: 마이크 소리(float) → 16kHz 모노 16비트. 받아쓰기 서버가 어떤 브라우저의 소리든 같은 형식으로 받게 한다 ---------- */
function encodeWav(chunks, n, sr) {

/* ---------- 음성 인식 연결 ---------- */
let stt = null, sttKind = "", forceServer = false;

}

    if (mode === "listen" && !hearing && !turnActive) {

      setMode("mute"); capMe.textContent = ""; note("한참 조용해서 마이크를 껐어요. 다시 말하려면 버튼을 눌러 주세요.");
    }

    if (mode !== "listen") return;

  },
  onHearing(on) { if (mode !== "listen") return; hearing = on; ui(); if (on) { bump(); capMe.textContent = "…"; capMe.classList.add("live"); } },
  onLevel(v) { orb.style.setProperty("--lv", v.toFixed(2)); },

/* ---------- 말하기(채팅) ---------- */

      let nl;
      while ((nl = b.indexOf("\n")) >= 0) {
        const line = b.slice(0, nl); b = b.slice(nl + 1);
        if (!line.trim()) continue;
        const ev = JSON.parse(line);
        if (ev.t === "start") rid = ev.reply;
        else if (ev.t === "text") { reply += ev.d; partial = reply; const c = cleanText(reply); out.textContent = c; capMajet.textContent = c; log.scrollTop = log.scrollHeight; }
        else if (ev.t === "emotion") setEmotion(ev.e);
        else if (ev.t === "seg") enqueue(fetch(`${API}/speech?r=${rid}&i=${ev.i}`).then((a) => a.ok ? a.blob() : null).then((x) => x && URL.createObjectURL(x)).catch(() => null), my);
      }
    }
    if (my !== turn) return;
    out.classList.remove("typing");
    reply = cleanText(reply).trim();
    out.textContent = reply; capMajet.textContent = reply;
    hist.push({ role: "assistant", content: reply }); committed = true; streamDone = true;
    maybeEnd();
  } catch (e) {
    if (my !== turn) return;  // 끼어들기로 멈춘 경우는 abortTurn이 이미 정리했다
    fail(timedOut ? "마젯이 너무 오래 생각해서 멈췄어요. 다시 말해 줘." : "앗, 연결이 끊겼어. 마젯 집 PC가 꺼져 있을 수도 있어요.", true);
    checkHealth();
  } finally { clearTimeout(timer); send.disabled = false; }
}

/* ---------- 조작 ---------- */
let wake = null;
async function keepAwake() { try { if (navigator.wakeLock && document.visibilityState === "visible") wake = await navigator.wakeLock.request("screen"); } catch (e) {} }
document.addEventListener("visibilitychange", () => { if (active) keepAwake(); });
function startSession() {
  if (turnActive) abortTurn();
  active = true; unlockAudio(); keepAwake();
  getStt().prepare();
  enterListen(0);
}
orb.addEventListener("click", () => {
  if (!active) { startSession(); return; }
  if (mode === "listen") { if (stt) stt.stop(); capMe.textContent = ""; capMe.classList.remove("live"); setMode("mute"); }
  else if (mode === "mute") { unlockAudio(); enterListen(0); }
  else if (turnActive) interrupt();
});
$("f").addEventListener("submit", (e) => {
  e.preventDefault(); unlockAudio();
  const t = q.value; q.value = ""; if (!t.trim()) return;
  ask(t);
});
const chatEl = $("chat");
$("openChat").addEventListener("click", () => { chatEl.classList.add("open"); log.scrollTop = log.scrollHeight; });
$("closeChat").addEventListener("click", () => chatEl.classList.remove("open"));

const dlg = $("settings");
$("openSettings").addEventListener("click", () => {
  $("optAuto").checked = prefs.auto; $("optBarge").checked = prefs.bargeIn; $("optStt").value = prefs.stt;
  $("optStt").querySelector('[value="browser"]').disabled = !SR;
  dlg.showModal();
});
function applySettings() {
  prefs.auto = $("optAuto").checked; prefs.bargeIn = $("optBarge").checked; prefs.stt = $("optStt").value; savePrefs();
  forceServer = false; ui();
  if (!active) return;
  const had = stt; const s = getStt();
  if (s !== had) { if (mode === "listen") s.start(); else if (prefs.bargeIn && turnActive) s.watch(); return; }
  if (!prefs.bargeIn && turnActive) s.stop(); else if (prefs.bargeIn && turnActive) s.watch();
  if (prefs.auto && mode === "mute" && !turnActive) enterListen(0);
}
for (const id of ["optAuto", "optBarge", "optStt"]) $(id).addEventListener("change", applySettings);

setEmotion("happy");
bubble("majet", "어 마짱이 왔어? 마이크 버튼 눌러서 아무 말이나 걸어 봐. 나 지금 심심했거든.");
ui(); checkHealth(); setInterval(checkHealth, 60000);
